<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Holocron</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="paper-page">
      <header class="paper-topbar">
        <a class="back-link" href="/">Back to library</a>
        <div class="paper-top-actions">
          <a id="paper-file-link" class="quiet-link" target="_blank" rel="noreferrer">Open in new tab</a>
        </div>
      </header>

      <section class="paper-layout">
        <section class="paper-main chat-shell">
          <div class="chat-header">
            <p id="paper-status" class="status-label"></p>
            <p id="chat-meta" class="caption">Ask while you read.</p>
          </div>
          <div id="chat-thread" class="chat-thread"></div>
          <form id="ask-form" class="ask-form chat-composer">
            <textarea id="ask-question" rows="3" placeholder="Ask this paper a question"></textarea>
            <div class="ask-actions">
              <span id="ask-model" class="caption"></span>
              <button id="ask-submit" type="submit">Ask</button>
            </div>
            <p id="ask-status" class="caption status-text"></p>
          </form>
        </section>

        <aside id="pdf-pane" class="pdf-pane">
          <iframe id="pdf-frame" title="Paper PDF" class="pdf-frame"></iframe>
        </aside>
      </section>
    </main>

    <script src="/paper.js" defer></script>
  </body>
</html>
