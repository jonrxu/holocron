[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holocron"
version = "0.1.0"
description = "A lightweight personal research memory for scientific papers."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["holocron", "holocron.static"]

[tool.setuptools.package-data]
"holocron.static" = ["index.html", "app.js", "styles.css"]
